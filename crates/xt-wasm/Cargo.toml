[package]
name = "xt-wasm"
description = "libreXTalk compiled to WebAssembly, with a small JSON interface for JavaScript hosts"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib: the .wasm module a browser or Node.js loads.
# rlib: so the same code also builds and tests as ordinary Rust.
crate-type = ["cdylib", "rlib"]

[dependencies]
xt-core = { path = "../xt-core" }
xt-stackfile = { path = "../xt-stackfile" }
